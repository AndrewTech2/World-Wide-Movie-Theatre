{% extends "layout_registered.html" %}

{% block title %}
Add movies
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="header">Add movie</h1>
    <div class="row d-flex flex-wrap justify-content-center add-container">
        <div class="col-xl-6 align-text-center">
            <h3>Search by title</h3>
            <form action="/add" method="post">
                <input autocomplete="off" name="title" type="search" class="form-control" placeholder="Title">
                <button type="submit" class="btn btn-success">Search</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
